# Zabbix agent 2 user parameter for Kafka consumer lag.
# Copy to /etc/zabbix/zabbix_agent2.d/ on ONE Kafka broker, with the script in /etc/zabbix/scripts/.
# Parameters: bootstrap server, optional client properties file (SASL / TLS).
UserParameter=kafka.consumer.lag[*],/etc/zabbix/scripts/kafka_consumer_lag.sh "$1" "$2"
