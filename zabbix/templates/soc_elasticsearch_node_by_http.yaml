zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: b6134a9989f04441a897b9b3f6839771
    name: Templates/SOC
  templates:
  - uuid: c9ee1a3ef3d14082a1e2a97cefaa01a0
    template: SOC Elasticsearch node by HTTP
    name: SOC - Nœud Elasticsearch par HTTP
    description: |
      Détail et statut d'UN serveur Elasticsearch. À lier à chaque nœud du cluster (masters, data, ML).
      Les requêtes sont faites par le serveur/proxy Zabbix sur l'API HTTP du nœud lui-même ({HOST.CONN}:{$ELASTICSEARCH.PORT}) : aucun agent n'est requis.

      Les métriques, clés, seuils, macros et graphiques par nœud sont ceux du template officiel « Elasticsearch Cluster by HTTP »
      (heap JVM, latences, pools de threads, HTTP, disque), sans l'index [{#ES.NODE}] puisque l'hôte EST le nœud.

      En plus du template officiel :
      - « ES: Node status » : 0 = Unreachable, 1 = Out of cluster, 2 = OK ;
      - nom, version, rôles, CPU, espace disque libre en %.

      Pour ne pas avoir d'alertes en double :
      - lier le template officiel à UN seul hôte représentant le cluster et y DÉSACTIVER la règle « Cluster nodes discovery » :
        l'officiel ne garde alors que les alertes globales (green/yellow/red, shards, masters) et ce template porte les alertes par nœud ;
      - un nœud injoignable ne lève qu'une alerte : les autres déclencheurs n'ont plus de données et restent muets.

      Les macros {$ELASTICSEARCH.*} portent le même nom que dans le template officiel : en macros globales, elles servent aux deux.
      Le certificat du nœud n'est pas vérifié (connexion par adresse IP).
    vendor:
      name: SOC
      version: 8.0-2
    groups:
    - name: Templates/SOC
    items:
    - uuid: 5bc979262a7c44db84cabc8475947adf
      name: 'ES: Get node info'
      type: HTTP_AGENT
      key: es.node.get_root
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: Root API endpoint of this node. On any error the value is replaced with {} so that the node status drops to 0.
      preprocessing: &id001
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '{}'
      timeout: 10s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/'
      tags:
      - tag: component
        value: raw
    - uuid: 7f762bba09a54998b37ed75a52948930
      name: 'ES: API reachable'
      type: DEPENDENT
      key: es.node.ping
      description: 1 if the HTTP API of this node answers correctly, 0 otherwise.
      valuemap:
        name: ES yes/no
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              return JSON.parse(value).cluster_name ? 1 : 0;
          }
          catch (e) {
              return 0;
          }
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: status
    - uuid: f6c978509ad147ddba92f28f30f844bd
      name: 'ES: Node name'
      type: DEPENDENT
      key: es.node.name
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.name
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: 4c73a92bb2a74e8cae7953cff5f08415
      name: 'ES: Cluster name'
      type: DEPENDENT
      key: es.node.cluster_name
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cluster_name
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: b2c9aa8a6c2c432b90ad9883dda95171
      name: 'ES: Version'
      type: DEPENDENT
      key: es.node.version
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.version.number
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: 6ca5404931cf443eb40a2ed4db682940
      name: 'ES: Get cluster health seen from this node'
      type: HTTP_AGENT
      key: es.node.get_health
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: 'A node without a master answers 503: the value is then replaced with {}.'
      preprocessing: *id001
      timeout: 15s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_cluster/health?master_timeout=5s&filter_path=status,number_of_nodes'
      tags:
      - tag: component
        value: raw
    - uuid: 83895d61a6a54c52942936dba8794e65
      name: 'ES: Joined the cluster'
      type: DEPENDENT
      key: es.node.joined
      description: 1 if this node sees a master and is part of the cluster, 0 otherwise.
      valuemap:
        name: ES yes/no
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              return JSON.parse(value).number_of_nodes > 0 ? 1 : 0;
          }
          catch (e) {
              return 0;
          }
      master_item:
        key: es.node.get_health
      tags:
      - tag: component
        value: status
    - uuid: eda61c255a424cd6829c325fc86a1f1f
      name: 'ES: Number of nodes seen in the cluster'
      type: DEPENDENT
      key: es.node.cluster_nodes
      description: Number of cluster nodes seen from this node. A difference between servers reveals a split cluster.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_nodes
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_health
      tags:
      - tag: component
        value: status
    - uuid: 9d3065d33656465f9b914a3a78a57e5f
      name: 'ES: Node status'
      type: CALCULATED
      key: es.node.status
      params: last(//es.node.ping)+last(//es.node.joined)
      description: 0 = Unreachable, 1 = Out of cluster, 2 = OK.
      valuemap:
        name: ES node status
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: dde9b009c13e427e97f2872eebf87da6
        expression: max(/SOC Elasticsearch node by HTTP/es.node.status,{$ELASTICSEARCH.NODE.STATUS.DELAY})=0
        name: 'Elasticsearch: Node is unreachable'
        priority: HIGH
        description: 'The HTTP API of this node does not answer: service stopped, network flow cut or credentials rejected.'
        tags:
        - tag: scope
          value: availability
      - uuid: 3079272c388a4cbbb165fe67de71784f
        expression: max(/SOC Elasticsearch node by HTTP/es.node.status,{$ELASTICSEARCH.NODE.STATUS.DELAY})=1
        name: 'Elasticsearch: Node is out of the cluster'
        priority: HIGH
        description: 'The service answers but the node sees no master: it has not joined the cluster.'
        tags:
        - tag: scope
          value: availability
    - uuid: 70214a2dcfa74b1aa9cf361c4b504b70
      name: 'ES: Get node stats'
      type: HTTP_AGENT
      key: es.node.get_stats
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: Returns the statistics of this node only (_local).
      timeout: 30s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_nodes/_local/stats?filter_path=nodes.*.name,nodes.*.roles,nodes.*.os.cpu.percent,nodes.*.fs.total.*,nodes.*.jvm.uptime_in_millis,nodes.*.jvm.mem.heap*,nodes.*.indices.*,nodes.*.thread_pool.*,nodes.*.http.current_open,nodes.*.http.total_opened'
      tags:
      - tag: component
        value: raw
    - uuid: 98edba7a5d214e9fa82bb6f4b53e2e50
      name: 'ES: Roles'
      type: DEPENDENT
      key: es.node.roles
      value_type: CHAR
      description: Roles of this node (master, data_hot, ml, ingest...).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..roles.first()
      - type: JAVASCRIPT
        parameters:
        - return JSON.parse(value).join(", ");
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: info
    - uuid: 7e37114975b64dfdbeb3ee65c1a6886f
      name: 'ES: CPU utilization'
      type: DEPENDENT
      key: es.node.os.cpu.percent
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..os.cpu.percent.first()
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: cpu
    - uuid: c83fa635a6fd4467ab589e036f142265
      name: 'ES: Free space in percent'
      type: DEPENDENT
      key: es.node.fs.total.free_percent
      value_type: FLOAT
      units: '%'
      description: Available space on the Elasticsearch data paths of this node.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..fs.total.first()
      - type: JAVASCRIPT
        parameters:
        - |
          var fs = JSON.parse(value);
          if (!fs.total_in_bytes) {
              throw 'total size is unknown';
          }
          return Math.round(fs.available_in_bytes / fs.total_in_bytes * 10000) / 100;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: storage
      triggers:
      - uuid: 7295dc2921454aea9e3611d2a99b4127
        expression: max(/SOC Elasticsearch node by HTTP/es.node.fs.total.free_percent,15m)<{$ELASTICSEARCH.FS.FREE.MIN.CRIT}
        name: 'Elasticsearch: Free disk space is critically low'
        priority: HIGH
        opdata: 'Free: {ITEM.LASTVALUE1}'
        description: Below the high watermark Elasticsearch relocates shards away from this node.
        tags:
        - tag: scope
          value: capacity
      - uuid: 8f7160633d3c4840828505ea0c88cf3e
        expression: max(/SOC Elasticsearch node by HTTP/es.node.fs.total.free_percent,15m)<{$ELASTICSEARCH.FS.FREE.MIN.WARN}
        name: 'Elasticsearch: Free disk space is low'
        priority: WARNING
        opdata: 'Free: {ITEM.LASTVALUE1}'
        description: Below the low watermark Elasticsearch stops allocating new shards to this node.
        dependencies:
        - name: 'Elasticsearch: Free disk space is critically low'
          expression: max(/SOC Elasticsearch node by HTTP/es.node.fs.total.free_percent,15m)<{$ELASTICSEARCH.FS.FREE.MIN.CRIT}
        tags:
        - tag: scope
          value: capacity
    - uuid: 82607a92b22848e194fe4ec26fc9dc4f
      name: 'ES: Total available size'
      type: DEPENDENT
      key: es.node.fs.total.available_in_bytes
      units: B
      description: |
        The total number of bytes available to this Java virtual machine on all file stores.
        Depending on OS or process level restrictions, this might appear less than fs.total.free_in_bytes.
        This is the actual amount of free disk space the Elasticsearch node can utilize.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..fs.total.available_in_bytes.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: storage
    - uuid: 35c199f60e84407dba3c79ccb25ce56e
      name: 'ES: Total size'
      type: DEPENDENT
      key: es.node.fs.total.total_in_bytes
      units: B
      description: Total size (in bytes) of all file stores.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..fs.total.total_in_bytes.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: storage
    - uuid: 273bf316cb8f46f49112bf89dc3aa9ed
      name: 'ES: Number of open HTTP connections'
      type: DEPENDENT
      key: es.node.http.current_open
      description: The number of currently open HTTP connections for the node.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..http.current_open.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: connections
    - uuid: 6945f7856bf048b9b62c58b55f70879d
      name: 'ES: Rate of HTTP connections opened'
      type: DEPENDENT
      key: es.node.http.opened.rate
      value_type: FLOAT
      units: '!rps'
      description: The number of HTTP connections opened for the node per second.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..http.total_opened.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: connections
    - uuid: a21d05d2a39d4a06aa6a75c20ba08497
      name: 'ES: Flush latency'
      type: CALCULATED
      key: es.node.indices.flush.latency
      value_type: FLOAT
      units: '!ms'
      params: change(//es.node.indices.flush.total_time_in_millis) / (change(//es.node.indices.flush.total) + (change(//es.node.indices.flush.total) = 0) )
      description: |
        The average flush latency calculated from the available flush.total and flush.total_time_in_millis metrics.
        If the calculated value cannot be evaluated due to missing historical data, the item returns '-1', indicating that there is not enough data to calculate the metric yet.
      valuemap:
        name: Missing data condition
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      tags:
      - tag: component
        value: operations
      triggers:
      - uuid: b577dfe9595c47c79e9ce4d4aff6f1b6
        expression: min(/SOC Elasticsearch node by HTTP/es.node.indices.flush.latency,5m)>{$ELASTICSEARCH.FLUSH_LATENCY.MAX.WARN}
        name: 'Elasticsearch: Flush latency is too high'
        event_name: 'Elasticsearch: Flush latency is too high (over {$ELASTICSEARCH.FLUSH_LATENCY.MAX.WARN}ms for 5m)'
        priority: WARNING
        description: |
          If you see this metric increasing steadily, it may indicate a problem with slow disks; this problem may escalate
          and eventually prevent you from being able to add new information to your index.
        tags:
        - tag: scope
          value: notice
    - uuid: 8989743537e541ccac985633bc24be50
      name: 'ES: Total number of index flushes to disk'
      type: DEPENDENT
      key: es.node.indices.flush.total
      description: The total number of flush operations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.flush.total.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: 450f15d0b1ed459c9eb3ada9bc534be3
      name: 'ES: Total time spent on flushing indices to disk'
      type: DEPENDENT
      key: es.node.indices.flush.total_time_in_millis
      units: '!ms'
      description: Total time in milliseconds spent performing flush operations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.flush.total_time_in_millis.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: 0bbe164acb214d7797d34a0153772a32
      name: 'ES: Current indexing operations'
      type: DEPENDENT
      key: es.node.indices.indexing.index_current
      description: The number of indexing operations currently running.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.indexing.index_current.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: 2a122010796e4ac681aa7e293fceb6e9
      name: 'ES: Indexing latency'
      type: CALCULATED
      key: es.node.indices.indexing.index_latency
      value_type: FLOAT
      units: '!ms'
      params: change(//es.node.indices.indexing.index_time_in_millis) / (change(//es.node.indices.indexing.index_total) + (change(//es.node.indices.indexing.index_total) = 0) )
      description: |
        The average indexing latency calculated from the available index_total and index_time_in_millis metrics.
        If the calculated value cannot be evaluated due to missing historical data, the item returns '-1', indicating that there is not enough data to calculate the metric yet.
      valuemap:
        name: Missing data condition
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      tags:
      - tag: component
        value: operations
      triggers:
      - uuid: 4f473a9c3a8948578680dc892a508a75
        expression: min(/SOC Elasticsearch node by HTTP/es.node.indices.indexing.index_latency,5m)>{$ELASTICSEARCH.INDEXING_LATENCY.MAX.WARN}
        name: 'Elasticsearch: Indexing latency is too high'
        event_name: 'Elasticsearch: Indexing latency is too high (over {$ELASTICSEARCH.INDEXING_LATENCY.MAX.WARN}ms for 5m)'
        priority: WARNING
        description: |
          If the latency is increasing, it may indicate that you are indexing too many documents at the same time (Elasticsearch's documentation
          recommends starting with a bulk indexing size of 5 to 15 megabytes and increasing slowly from there).
        tags:
        - tag: scope
          value: notice
    - uuid: 0190c900a1544dc8b697af61dadcee98
      name: 'ES: Total time spent performing indexing'
      type: DEPENDENT
      key: es.node.indices.indexing.index_time_in_millis
      units: '!ms'
      description: Total time in milliseconds spent performing indexing operations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.indexing.index_time_in_millis.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: 1c1f2b71a7944009b038459193c93254
      name: 'ES: Total number of indexing'
      type: DEPENDENT
      key: es.node.indices.indexing.index_total
      description: The total number of indexing operations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.indexing.index_total.first()
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: e71bb0fa012e4eabaf3ac4f4f2c81a5f
      name: 'ES: Time spent throttling operations'
      type: DEPENDENT
      key: es.node.indices.indexing.throttle_time
      value_type: FLOAT
      units: s
      description: Time in seconds spent throttling operations for the last measuring span.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.indexing.throttle_time_in_millis.first()
      - type: MULTIPLIER
        parameters:
        - '0.001'
      - type: SIMPLE_CHANGE
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: e7be948049124220a9af938504b7bb72
      name: 'ES: Time spent throttling merge operations'
      type: DEPENDENT
      key: es.node.indices.merges.total_throttled_time
      value_type: FLOAT
      units: s
      description: Time in seconds spent throttling merge operations for the last measuring span.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.merges.total_throttled_time_in_millis.first()
      - type: MULTIPLIER
        parameters:
        - '0.001'
      - type: SIMPLE_CHANGE
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: b230378104824d4cb22d757e594f2a5e
      name: 'ES: Time spent throttling recovery operations'
      type: DEPENDENT
      key: es.node.indices.recovery.throttle_time
      value_type: FLOAT
      units: s
      description: Time in seconds spent throttling recovery operations for the last measuring span.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.recovery.throttle_time_in_millis.first()
      - type: MULTIPLIER
        parameters:
        - '0.001'
      - type: SIMPLE_CHANGE
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: b3391b14060a47e494a535149100d200
      name: 'ES: Rate of index refreshes'
      type: DEPENDENT
      key: es.node.indices.refresh.rate
      value_type: FLOAT
      units: '!rps'
      description: The number of refresh operations per second.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.refresh.total.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: 2d1b4d81a9ae49299dd15c7d629fa60a
      name: 'ES: Time spent performing refresh'
      type: DEPENDENT
      key: es.node.indices.refresh.time
      value_type: FLOAT
      units: s
      description: Time in seconds spent performing refresh operations for the last measuring span.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.refresh.total_time_in_millis.first()
      - type: MULTIPLIER
        parameters:
        - '0.001'
      - type: SIMPLE_CHANGE
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: operations
    - uuid: b804f9552cfe46b6ac566073d5806904
      name: 'ES: Rate of fetch'
      type: DEPENDENT
      key: es.node.indices.search.fetch.rate
      value_type: FLOAT
      units: '!rps'
      description: The number of fetch operations per second.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.search.fetch_total.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: fetches
    - uuid: 0839c98457654abb8fa356719ba9b4f3
      name: 'ES: Current fetch operations'
      type: DEPENDENT
      key: es.node.indices.search.fetch_current
      description: The number of fetch operations currently running.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..indices.search.fetch_current.first()
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: fetches
    - uuid: 18717a5aa05c42d392720d9c047ec606
      name: 'ES: Fetch latency'
      type: CALCULATED
      key: es.node.indices.search.fetch_latency
      value_type: FLOAT
      units: '!ms'
      params: change(//es.node.indices.search.fetch_time_in_millis) / (change(//es.node.indices.search.fetch_total) + (change(//es.node.indices.search.fetch_total) = 0) )
      description: |
        The average fetch latency calculated by sampling the total number of fetches and the total elapsed time at regular intervals.
        If the calculated value cannot be evaluated due to missing historical data, the item returns '-1', indicating that there is not enough data to calculate the metric yet.
      valuemap:
        name: Missing data condition
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      tags:
      - tag: component
        value: fetches
      triggers:
      - uuid: 7e933a6ea5e04162912ddb3136142799
        expression: min(/SOC Elasticsearch node by HTTP/es.node.indices.search.fetch_latency,5m)>{$ELASTICSEARCH.FETCH_LATENCY.MAX.WARN}
        name: 'Elasticsearch: Fetch latency is too high'
        event_name: 'Elasticsearch: Fetch latency is too high (over {$ELASTICSEARCH.FETCH_LATENCY.MAX.WARN}ms for 5m)'
        priority: WARNING
        description: |
          The fetch phase should typically take much less time than the query phase. If you notice this metric consistently increasing,
          this could indicate a problem with slow disks, enriching of documents (highlighting the relevant text in search results, etc.),
          or requesting too many results.
        tags:
        - tag: scope
          value: notice
