    - macro: '{$ELASTICSEARCH.FS.FREE.MIN.WARN}'
      value: '15'
      description: Warning threshold of free disk space on the data paths, in %.
    - macro: '{$ELASTICSEARCH.HEAP_USED.MAX.CRIT}'
      value: '95'
