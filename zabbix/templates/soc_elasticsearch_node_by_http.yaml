zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: b6134a9989f04441a897b9b3f6839771
    name: Templates/SOC
  templates:
  - uuid: c9ee1a3ef3d14082a1e2a97cefaa01a0
    template: SOC Elasticsearch node by HTTP
    name: SOC - Nœud Elasticsearch par HTTP
    description: |
      Statut d'UN serveur Elasticsearch. À lier à chaque nœud du cluster (masters, data, ML).
      Complète le template officiel « Elasticsearch Cluster by HTTP » sans le recopier : aucune métrique ni alerte en commun.
      Les requêtes sont faites par le serveur/proxy Zabbix sur l'API HTTP du nœud lui-même ({HOST.CONN}:{$ELASTICSEARCH.PORT}) : aucun agent n'est requis.

      Ce que ce template ajoute :
      - « ES: Node status » : 0 = Unreachable, 1 = Out of cluster, 2 = OK ;
      - nom du nœud, version, rôles, déclenchements de circuit breakers.

      Deux alertes seulement : nœud injoignable, nœud hors cluster.
      CPU, mémoire et disques du serveur restent supervisés par le template Linux (Zabbix agent).
      Heap JVM, latences et pools de threads par nœud restent dans le template officiel.

      Les macros {$ELASTICSEARCH.*} portent le même nom que dans le template officiel : en macros globales, elles servent aux deux.
      Le certificat du nœud n'est pas vérifié (connexion par adresse IP).
    vendor:
      name: SOC
      version: 8.0-4
    groups:
    - name: Templates/SOC
    items:
    - uuid: 5bc979262a7c44db84cabc8475947adf
      name: 'ES: Get node info'
      type: HTTP_AGENT
      key: es.node.get_root
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: Root API endpoint of this node. On any error the value is replaced with {} so that the node status drops to 0.
      preprocessing: &id001
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '{}'
      timeout: 10s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/'
      tags:
      - tag: component
        value: raw
    - uuid: 7f762bba09a54998b37ed75a52948930
      name: 'ES: API reachable'
      type: DEPENDENT
      key: es.node.ping
      description: 1 if the HTTP API of this node answers correctly, 0 otherwise.
      valuemap:
        name: ES yes/no
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              return JSON.parse(value).cluster_name ? 1 : 0;
          }
          catch (e) {
              return 0;
          }
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: status
    - uuid: f6c978509ad147ddba92f28f30f844bd
      name: 'ES: Node name'
      type: DEPENDENT
      key: es.node.name
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.name
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: 4c73a92bb2a74e8cae7953cff5f08415
      name: 'ES: Cluster name'
      type: DEPENDENT
      key: es.node.cluster_name
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cluster_name
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: b2c9aa8a6c2c432b90ad9883dda95171
      name: 'ES: Version'
      type: DEPENDENT
      key: es.node.version
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.version.number
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_root
      tags:
      - tag: component
        value: info
    - uuid: 6ca5404931cf443eb40a2ed4db682940
      name: 'ES: Get cluster health seen from this node'
      type: HTTP_AGENT
      key: es.node.get_health
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: 'A node without a master answers 503: the value is then replaced with {}.'
      preprocessing: *id001
      timeout: 15s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_cluster/health?master_timeout=5s&filter_path=status,number_of_nodes'
      tags:
      - tag: component
        value: raw
    - uuid: 83895d61a6a54c52942936dba8794e65
      name: 'ES: Joined the cluster'
      type: DEPENDENT
      key: es.node.joined
      description: 1 if this node sees a master and is part of the cluster, 0 otherwise.
      valuemap:
        name: ES yes/no
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              return JSON.parse(value).number_of_nodes > 0 ? 1 : 0;
          }
          catch (e) {
              return 0;
          }
      master_item:
        key: es.node.get_health
      tags:
      - tag: component
        value: status
    - uuid: eda61c255a424cd6829c325fc86a1f1f
      name: 'ES: Number of nodes seen in the cluster'
      type: DEPENDENT
      key: es.node.cluster_nodes
      description: Number of cluster nodes seen from this node. A difference between servers reveals a split cluster.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_nodes
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: es.node.get_health
      tags:
      - tag: component
        value: status
    - uuid: 9d3065d33656465f9b914a3a78a57e5f
      name: 'ES: Node status'
      type: CALCULATED
      key: es.node.status
      params: last(//es.node.ping)+last(//es.node.joined)
      description: 0 = Unreachable, 1 = Out of cluster, 2 = OK.
      valuemap:
        name: ES node status
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: dde9b009c13e427e97f2872eebf87da6
        expression: max(/SOC Elasticsearch node by HTTP/es.node.status,{$ELASTICSEARCH.NODE.STATUS.DELAY})=0
        name: 'Elasticsearch: Node is unreachable'
        priority: HIGH
        description: 'The HTTP API of this node does not answer: service stopped, network flow cut or credentials rejected.'
        tags:
        - tag: scope
          value: availability
      - uuid: 3079272c388a4cbbb165fe67de71784f
        expression: max(/SOC Elasticsearch node by HTTP/es.node.status,{$ELASTICSEARCH.NODE.STATUS.DELAY})=1
        name: 'Elasticsearch: Node is out of the cluster'
        priority: HIGH
        description: 'The service answers but the node sees no master: it has not joined the cluster.'
        tags:
        - tag: scope
          value: availability
    - uuid: 70214a2dcfa74b1aa9cf361c4b504b70
      name: 'ES: Get node stats'
      type: HTTP_AGENT
      key: es.node.get_stats
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: '{$ELASTICSEARCH.USERNAME}'
      password: '{$ELASTICSEARCH.PASSWORD}'
      description: Statistics of this node only (_local), limited to what the official template does not collect.
      timeout: 15s
      url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_nodes/_local/stats?filter_path=nodes.*.roles,nodes.*.breakers.*.tripped'
      tags:
      - tag: component
        value: raw
    - uuid: 98edba7a5d214e9fa82bb6f4b53e2e50
      name: 'ES: Roles'
      type: DEPENDENT
      key: es.node.roles
      value_type: CHAR
      description: Roles of this node (master, data_hot, ml, ingest...).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..roles.first()
      - type: JAVASCRIPT
        parameters:
        - return JSON.parse(value).join(", ");
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: info
    - uuid: 1dacf516f74947e7b8a65d8fdb7747ba
      name: 'ES: Circuit breakers tripped'
      type: DEPENDENT
      key: es.node.breakers.tripped
      description: Number of circuit breaker trips on this node since the previous check (all breakers).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..breakers.first()
      - type: JAVASCRIPT
        parameters:
        - |
          var b = JSON.parse(value);
          var n = 0;
          for (var k in b) {
              n += b[k].tripped || 0;
          }
          return n;
      - type: SIMPLE_CHANGE
        parameters:
        - ''
      master_item:
        key: es.node.get_stats
      tags:
      - tag: component
        value: memory
    tags:
    - tag: class
      value: database
    - tag: target
      value: elasticsearch
    macros:
    - macro: '{$ELASTICSEARCH.NODE.STATUS.DELAY}'
      value: 3m
      description: How long the node status must stay degraded before a problem is raised.
    - macro: '{$ELASTICSEARCH.PASSWORD}'
      type: SECRET_TEXT
      description: Elasticsearch password (same macro as the official template).
    - macro: '{$ELASTICSEARCH.PORT}'
      value: '9200'
      description: Elasticsearch HTTP port (same macro as the official template).
    - macro: '{$ELASTICSEARCH.SCHEME}'
      value: https
      description: http or https (same macro as the official template).
    - macro: '{$ELASTICSEARCH.USERNAME}'
      description: Elasticsearch user with the "monitor" cluster privilege (same macro as the official template).
    valuemaps:
    - uuid: a74d20323be04ec7a8306ab90a488abc
      name: ES yes/no
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
    - uuid: 7c9f3509f49842efbc853c404a0a5d46
      name: ES node status
      mappings:
      - value: '0'
        newvalue: Unreachable
      - value: '1'
        newvalue: Out of cluster
      - value: '2'
        newvalue: OK
