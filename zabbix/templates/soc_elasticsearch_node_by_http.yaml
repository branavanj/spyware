        name: 'Elasticsearch: Percent of JVM heap in use is critical'
        event_name: 'Elasticsearch: Percent of JVM heap in use is critical (over {$ELASTICSEARCH.HEAP_USED.MAX.CRIT}% for 1h)'
        priority: HIGH
        description: |
          This indicates that the rate of garbage collection isn't keeping up with the rate of garbage creation.
